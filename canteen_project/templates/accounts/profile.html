{% extends 'base.html' %}

{% block content %}
<div class="max-w-md mx-auto px-4 py-8">
    <div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-100 space-y-4">
        <div class="flex items-center gap-3 border-b pb-4">
            <div class="w-12 h-12 bg-orange-100 text-orange-600 rounded-full flex items-center justify-center font-bold text-xl">
                {{ request.user.username|slice:":1"|upper }}
            </div>
            <div>
                <h3 class="font-bold text-gray-800 text-lg">{{ request.user.username }}</h3>
                <p class="text-xs text-gray-500">Student Account</p>
            </div>
        </div>

        <form method="POST" action="{% url 'profile' %}" class="space-y-4">
            {% csrf_token %}
            <div>
                <label class="block text-xs font-semibold text-gray-600 uppercase mb-1">Username</label>
                <input type="text" value="{{ request.user.username }}" disabled class="w-full px-3 py-2 border rounded-xl bg-gray-50 text-gray-500 text-sm outline-none">
            </div>

            <div>
                <label class="block text-xs font-semibold text-gray-600 uppercase mb-1">Phone Number</label>
                <input type="tel" name="phone_number" value="{{ request.user.phone_number }}" required class="w-full px-3 py-2 border rounded-xl text-sm focus:ring-2 focus:ring-orange-500 outline-none">
            </div>

            <div>
                <label class="block text-xs font-semibold text-gray-600 uppercase mb-1">Default Room / Hostel / Class</label>
                <input type="text" name="room_or_class" value="{{ request.user.room_or_class|default:'' }}" class="w-full px-3 py-2 border rounded-xl text-sm focus:ring-2 focus:ring-orange-500 outline-none">
            </div>

            <button type="submit" class="w-full bg-orange-500 hover:bg-orange-600 text-white font-bold py-2.5 rounded-xl text-xs transition">
                Save Changes
            </button>
        </form>

        <div class="pt-2 border-t text-center">
            <a href="{% url 'dashboard_home' %}" class="text-xs text-orange-600 font-semibold hover:underline">← Back to Menu</a>
        </div>
    </div>
</div>
{% endblock %}
