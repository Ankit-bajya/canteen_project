{% extends 'base.html' %}

{% block content %}
<div class="flex items-center justify-center min-h-screen px-4">
    <div class="bg-white p-8 rounded-2xl shadow-xl w-full max-w-md border border-gray-100">
        <h2 class="text-2xl font-bold text-center text-orange-600 mb-2">Campus Canteen</h2>
        <p class="text-xs text-gray-500 text-center mb-6">Naya Account Banayein</p>
        
        <form method="POST" action="{% url 'register' %}" class="space-y-4">
            {% csrf_token %}
            <div>
                <label class="block text-xs font-semibold text-gray-600 uppercase mb-1">Username</label>
                <input type="text" name="username" required class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-orange-500 outline-none text-sm">
            </div>

            <div>
                <label class="block text-xs font-semibold text-gray-600 uppercase mb-1">Mobile Number</label>
                <input type="tel" name="phone_number" maxlength="10" required class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-orange-500 outline-none text-sm">
            </div>

            <div>
                <label class="block text-xs font-semibold text-gray-600 uppercase mb-1">Room / Class Details</label>
                <input type="text" name="room_or_class" placeholder="e.g. Room 204 / B.Tech CS" class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-orange-500 outline-none text-sm">
            </div>

            <div>
                <label class="block text-xs font-semibold text-gray-600 uppercase mb-1">Password</label>
                <input type="password" name="password" required class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-orange-500 outline-none text-sm">
            </div>

            <button type="submit" class="w-full bg-orange-500 hover:bg-orange-600 text-white font-semibold py-2.5 rounded-lg transition duration-200">
                Register
            </button>
        </form>

        <p class="text-xs text-center text-gray-600 mt-6">
            Pehle se account hai? <a href="{% url 'login' %}" class="text-orange-600 font-semibold hover:underline">Login Karein</a>
        </p>
    </div>
</div>
{% endblock %}
